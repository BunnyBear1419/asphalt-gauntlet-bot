name: Discloud Retry Syntax Diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to Discloud
        id: deploy1
        continue-on-error: true
        uses: discloud/deploy-action@v1
        with:
          token: placeholder
          app_id: asph
          glob: '**'
          team: false

      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 1
