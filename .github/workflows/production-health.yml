name: Production Health Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Discloud application status
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
        run: |
          set -euo pipefail

          if [ -z "$DISCLOUD_TOKEN" ] || [ -z "$DISCLOUD_APP_ID" ]; then
            echo "ERROR: Required Discloud secrets are missing."
            exit 1
          fi

          echo "Checking Discloud application status..."
          HTTP_CODE=$(curl -sS -o discloud-status.json -w "%{http_code}" \
            -H "api-token: $DISCLOUD_TOKEN" \
            -H "Accept: application/json" \
            "https://api.discloud.app/v2/app/${DISCLOUD_APP_ID}/status")

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Discloud status API request failed."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("discloud-status.json").read_text())
          values = []

          def collect(value):
              if isinstance(value, dict):
                  for item in value.values():
                      collect(item)
              elif isinstance(value, list):
                  for item in value:
                      collect(item)
              elif isinstance(value, str):
                  values.append(value.strip().lower())

          collect(data)
          healthy_states = {"running", "online", "active", "ready"}
          found = sorted(healthy_states.intersection(values))

          if found:
              print("Discloud status reports healthy:", ", ".join(found))
          else:
              print("WARNING: Discloud status API did not report a healthy state:", values)
              print("Runtime heartbeat and application health signals are authoritative.")
          PY
      - name: Check Discord bot token
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -e

          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            echo "ERROR: DISCORD_BOT_TOKEN GitHub secret is missing."
            exit 1
          fi

          HTTP_CODE=$(curl -sS -o discord-user.json -w "%{http_code}"             -H "Authorization: Bot $DISCORD_BOT_TOKEN"             -H "Accept: application/json"             "https://discord.com/api/v10/users/@me")

          echo "Discord API HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Discord bot token/API check failed."
            cat discord-user.json
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("discord-user.json").read_text())
          print(f"Discord bot reachable: {data.get('username', 'unknown')}")
          print(f"Bot ID: {data.get('id', 'unknown')}")
          PY


      - name: Check bot heartbeat and MongoDB health signal
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          if [ -z "$MONGO_URI" ]; then
            echo "ERROR: MONGO_URI GitHub secret is missing."
            exit 1
          fi
          python -m pip install --quiet pymongo
          MONGO_URI="$MONGO_URI" python - <<'PY'
          import os
          import time
          from pymongo import MongoClient

          client = MongoClient(os.environ["MONGO_URI"], serverSelectionTimeoutMS=10000)
          client.admin.command("ping")
          hb = client["asphalt_gauntlet"].system_events.find_one({"_id": "production_heartbeat"})
          if not hb:
              raise SystemExit("ERROR: No production heartbeat has been recorded yet.")
          age = time.time() - float(hb.get("timestamp", 0))
          print(f"Heartbeat age: {age:.0f}s | ready={hb.get('ready')} | db_ok={hb.get('db_ok')} | guilds={hb.get('guild_count')}")
          if age > 1200:
              raise SystemExit("ERROR: Production heartbeat is older than 20 minutes.")
          if not hb.get("ready") or not hb.get("db_ok"):
              raise SystemExit("ERROR: Latest production heartbeat reports bot or database unhealthy.")
          print("Production heartbeat health check passed.")
          client.close()
          PY

      - name: Check production health signals
        run: |
          set -euo pipefail
          echo "No guild-specific health channel is required."
          echo "Discloud API status was checked; runtime heartbeat and application health signals are authoritative."

      - name: Health check passed
        run: |
          echo "Production health check passed."
          echo "Discloud application is healthy and the Discord bot token is valid."

      - name: Notify central monitoring channel on failure
        if: ${{ failure() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -e

          # Central monitoring only. No Discord guild/server ID is used.
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "WARNING: DISCORD_WEBHOOK_URL GitHub secret is missing; failure notification skipped."
            exit 0
          fi

          payload=$(python - <<'PY'
          import json
          import os

          print(json.dumps({
              "content": "🚨 **Production Health Check FAILED**\n"
                         f"Repository: `{os.environ['GITHUB_REPOSITORY']}`\n"
                         f"Workflow run: {os.environ['RUN_URL']}"
          }))
          PY
          )

          curl -sS -X POST             -H "Content-Type: application/json"             --data "$payload"             "$DISCORD_WEBHOOK_URL"

          echo "Central monitoring notification sent."
