name: Discloud Second Retry Diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy attempt 1
        id: deploy1
        run: echo "first"

      - name: Wait
        if: steps.deploy1.outcome == 'failure'
        run: sleep 1

      - name: Deploy attempt 2
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: discloud/deploy-action@v1
        with:
          token: placeholder
          app_id: asph
          glob: '**'
          team: false

      - name: Wait before retry 3
        if: steps.deploy2.outcome == 'failure'
        run: sleep 1
