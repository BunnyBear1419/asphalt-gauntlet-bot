name: MongoDB Backup

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install MongoDB Database Tools
        run: |
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.18.0.deb
          sudo apt install -y ./mongodb-database-tools-ubuntu2204-x86_64-100.18.0.deb
          mongodump --version

      - name: Create MongoDB backup
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail

          mkdir -p backup

          echo "Starting MongoDB dump..."

          mongodump             --uri="$MONGO_URI"             --db="myDiscordBot"             --archive=backup/mongodb.archive.gz             --gzip             --verbose 2>&1 | tee backup/mongodump.log

          echo "Checking dump result..."

          if grep -q "dumping up to 0 collections in parallel" backup/mongodump.log; then
            echo "ERROR: No collections were dumped from asphalt_gauntlet."
            exit 1
          fi

          if [ ! -s backup/mongodb.archive.gz ]; then
            echo "ERROR: Backup archive is empty."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s backup/mongodb.archive.gz)
          echo "Backup size: ${FILE_SIZE} bytes"

          echo "MongoDB backup archive created successfully."

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup-${{ github.run_number }}
          path: backup/mongodb.archive.gz
          retention-days: 90
          if-no-files-found: error
