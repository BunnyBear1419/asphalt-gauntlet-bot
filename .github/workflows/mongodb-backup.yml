name: MongoDB Backup

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install MongoDB Database Tools
        run: |
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.18.0.deb
          sudo apt install -y ./mongodb-database-tools-ubuntu2204-x86_64-100.18.0.deb
          mongodump --version

      - name: Create MongoDB backup
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail

          mkdir -p backup

          # The bot uses the asphalt_gauntlet database.
          # Strip the database name from MONGO_URI while preserving
          # query options. MongoDB requires "/" before a query string.
          BACKUP_URI=$(python - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit

          uri = os.environ["MONGO_URI"]
          parts = urlsplit(uri)

          if not parts.scheme or not parts.netloc:
              raise SystemExit("ERROR: MONGO_URI is invalid.")

          print(urlunsplit((
              parts.scheme,
              parts.netloc,
              "/",
              parts.query,
              parts.fragment,
          )))
          PY
          )

          echo "Starting MongoDB dump..."
          mongodump \
            --uri="$BACKUP_URI" \
            --db="asphalt_gauntlet" \
            --archive=backup/mongodb.archive.gz \
            --gzip \
            --verbose 2>&1 | tee backup/mongodump.log

          echo "Backup file:"
          ls -lh backup/mongodb.archive.gz

          if [ ! -s backup/mongodb.archive.gz ]; then
            echo "ERROR: Backup archive is empty."
            exit 1
          fi

          if grep -q "dumping up to 0 collections in parallel" backup/mongodump.log; then
            echo "ERROR: No collections were dumped from asphalt_gauntlet."
            echo "The backup would contain no database data."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s backup/mongodb.archive.gz)
          echo "Backup size: ${FILE_SIZE} bytes"

          echo "MongoDB backup archive created successfully."

      - name: Upload backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mongodb-backup-${{ github.run_number }}
          path: backup/mongodb.archive.gz
          retention-days: 90
          if-no-files-found: error

      - name: Notify ops channel on failure
        if: failure()
        env:
          DISCORD_ALERT_WEBHOOK: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
        run: |
          set -e
          if [ -z "$DISCORD_ALERT_WEBHOOK" ]; then
            echo "DISCORD_ALERT_WEBHOOK secret not set; skipping notification."
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(jq -n \
            --arg title "🔴 MongoDB Backup Failed" \
            --arg desc "The **MongoDB Backup** workflow failed on \`${{ github.repository }}\`." \
            --arg run_url "$RUN_URL" \
            --arg run_number "${{ github.run_number }}" \
            '{embeds: [{
              title: $title,
              description: $desc,
              color: 15158332,
              fields: [
                {name: "Run", value: ("[#" + $run_number + " logs](" + $run_url + ")"), inline: true}
              ]
            }]}')

          curl -sf -X POST "$DISCORD_ALERT_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
