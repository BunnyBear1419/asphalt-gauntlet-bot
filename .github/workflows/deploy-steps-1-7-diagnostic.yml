name: Deploy Steps 1-7 Diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ false }}
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python for deployment checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deployment check dependencies
        run: python -m pip install --quiet pymongo

      - name: Validate homepage hero JPG
        run: |
          set -euo pipefail
          HERO_JPG="ALU_Gauntlet/web/static/assets/home-hero-4k.jpg"
          if [ ! -f "$HERO_JPG" ]; then
            echo "ERROR: $HERO_JPG is missing from the repository."
            exit 1
          fi
          file "$HERO_JPG"
          if ! file "$HERO_JPG" | grep -qi "JPEG image data"; then
            echo "ERROR: Homepage hero asset is not a valid JPEG."
            exit 1
          fi
          echo "Homepage hero JPG is valid and will be deployed as committed."

      - name: Determine rollback revision
        id: revision
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          previous="$EVENT_BEFORE"
          if [ -z "$previous" ] || [ "$previous" = "0000000000000000000000000000000000000000" ]; then
            previous="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$previous^{commit}"
          current="$(git rev-parse HEAD)"
          if [ "$previous" = "$current" ]; then
            echo "ERROR: Rollback revision resolves to the release being deployed."
            exit 1
          fi
          git merge-base --is-ancestor "$previous" "$current"
          echo "Rollback revision is a committed predecessor of the release."
          echo "previous_sha=$previous" >> "$GITHUB_OUTPUT"
          echo "Rollback revision: $previous"

      - name: Validate deployment secrets are present
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          for name in DISCLOUD_TOKEN DISCORD_BOT_TOKEN MONGO_URI; do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name GitHub secret is missing from the deploy job."
              exit 1
            fi
          done
          echo "Deployment secrets are present. Production Discloud app is fixed to asph. Secret values are never printed."

      - name: Validate Discord bot token before deployment
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o discord-preflight.json -w "%{http_code}" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Accept: application/json" \
            "https://discord.com/api/v10/users/@me" || true)
          echo "Discord API preflight HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: DISCORD_BOT_TOKEN is present but Discord rejected it. Deployment stopped before touching Discloud."
            exit 1
          fi
          echo "Discord bot token preflight passed."

