name: RSL Live Browser E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed RSL URL"
        required: false
        default: "https://asph.discloud.app"
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

concurrency:
  group: rsl-live-browser-e2e
  cancel-in-progress: true

jobs:
  live-e2e:
    name: live-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RSL_LIVE_URL: ${{ inputs.base_url || 'https://asph.discloud.app' }}
      # Optional repository secret containing a dedicated test account's Playwright
      # storageState JSON. Leave unset to keep this workflow read-only/unauthenticated.
      RSL_E2E_AUTH_STATE: ${{ secrets.RSL_E2E_AUTH_STATE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run read-only live browser acceptance
        run: python scripts/live_e2e.py
