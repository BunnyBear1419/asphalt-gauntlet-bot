name: Discloud Action Diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ false }}
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
      - name: Fail if all Discloud deploy attempts failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: |
          echo "All Discloud deployment attempts failed."
          exit 1

