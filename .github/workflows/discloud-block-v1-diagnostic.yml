name: Discloud Deploy Block V1 Diagnostic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ false }}
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
      - name: Fail if all Discloud deploy attempts failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: |
          echo "All Discloud deployment attempts failed."
          exit 1

      - name: Restart Discloud app after upload
        id: restart
        continue-on-error: true
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: asph
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            restart_http=$(curl -sS -o discloud-restart.json -w "%{http_code}" -X PUT \
              -H "api-token: $DISCLOUD_TOKEN" \
              -H "Accept: application/json" \
              "https://api.discloud.app/v2/app/${DISCLOUD_APP_ID}/restart" || true)
            echo "Discloud restart attempt $attempt/3 HTTP status: $restart_http"
            if [ "$restart_http" = "200" ]; then
              echo "Discloud restart requested successfully."
              exit 0
            fi
            cat discloud-restart.json || true
            if [ "$attempt" -lt 3 ]; then
              echo "Restart request did not succeed; retrying in 20 seconds."
              sleep 20
            fi
          done
          echo "ERROR: Discloud restart failed after 3 attempts."
          exit 1
      # Use the exact curl/header pattern from production-health.yml. The prior
      # implementation used Python urllib for Discloud and received HTTP 403
      # while the production monitor using curl remained healthy.
      - name: Post-deployment smoke test
        id: smoke
        if: steps.restart.outcome == 'success'
        continue-on-error: true
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: asph
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PREVIOUS_HEARTBEAT_AT: ${{ steps.predeploy.outputs.heartbeat_at }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "Smoke test attempt $attempt/12"
            ok=true

            DISCLOUD_HTTP=$(curl -sS -o discloud-status.json -w "%{http_code}" \
              -H "api-token: $DISCLOUD_TOKEN" \
              -H "Accept: application/json" \
              "https://api.discloud.app/v2/app/${DISCLOUD_APP_ID}/status" || true)
            echo "Discloud HTTP status: $DISCLOUD_HTTP"

            if [ "$DISCLOUD_HTTP" != "200" ]; then
              echo "Discloud status check failed."
              ok=false
            else
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("discloud-status.json").read_text())
          values = []
          def collect(value):
              if isinstance(value, dict):
                  for item in value.values(): collect(item)
              elif isinstance(value, list):
                  for item in value: collect(item)
              elif isinstance(value, str):
                  values.append(value.strip().lower())
          collect(data)
          healthy = {"running", "online", "active", "ready"}.intersection(values)
          if healthy:
              print("Discloud status reports healthy:", ", ".join(sorted(healthy)))
          else:
              print("WARNING: Discloud status API did not report a healthy state:", values)
              print("Continuing; web health and production heartbeat are authoritative runtime checks.")
          PY
            fi

            HEARTBEAT_OK=$(MONGO_URI="$MONGO_URI" PREVIOUS_HEARTBEAT_AT="$PREVIOUS_HEARTBEAT_AT" python - <<'PY'
import os
import time
from pymongo import MongoClient

client = MongoClient(os.environ["MONGO_URI"], serverSelectionTimeoutMS=10000)
client.admin.command("ping")
hb = client["asphalt_gauntlet"].system_events.find_one({"_id": "production_heartbeat"})
client.close()

if not hb or not hb.get("ready") or not hb.get("db_ok"):
    print("false")
    raise SystemExit

timestamp = float(hb.get("timestamp", 0))
previous = float(os.environ.get("PREVIOUS_HEARTBEAT_AT", "0") or 0)
age = time.time() - timestamp
if age > 120 or (previous and timestamp <= previous):
    print("false")
    raise SystemExit

print("true")
PY
            ) || HEARTBEAT_OK=false
            echo "Production heartbeat gate: $HEARTBEAT_OK"
            if [ "$HEARTBEAT_OK" != "true" ]; then
              echo "Production heartbeat is missing, unhealthy, stale, or has not advanced past the pre-deploy heartbeat."
              ok=false
            fi

            WEB_HTTP=$(curl -sS -o web-health.json -w "%{http_code}" "https://asph.discloud.app/healthz" || true)
            echo "Web health HTTP status: $WEB_HTTP"
            if [ "$WEB_HTTP" != "200" ]; then
              echo "Web control-center health endpoint failed."
              ok=false
            else
              python - <<'PY' || ok=false
          import json
          from pathlib import Path
          data=json.loads(Path("web-health.json").read_text())
          if not data.get("ok"):
              raise SystemExit(f"Web health reports unhealthy: {data}")
          print("Web control-center health check passed.")
          PY
            fi

            # Once the four core runtime signals are healthy, perform the deeper
            # static/Discord/session checks once. This avoids downloading the same
            # artwork/CSS repeatedly while Discloud is still starting.
            if [ "$ok" = true ]; then
              echo "Core production health is ready; running deep smoke checks once."

              for check in                 "https://asph.discloud.app/login"                 "https://asph.discloud.app/"                 "https://asph.discloud.app/static/app.css"; do
                case "$check" in
                  *"/login") output="web-login.html"; label="Web login" ;;
                  *"/static/app.css") output="web-css.css"; label="Web static CSS" ;;
                  *) output="web-home.html"; label="Web homepage" ;;
                esac
                HTTP=$(curl -sS -o "$output" -w "%{http_code}" "$check" || true)
                echo "$label HTTP status: $HTTP"
                if [ "$HTTP" != "200" ]; then ok=false; fi
              done

              HERO_JPG_HTTP=$(curl -sS -o hero-home.jpg -w "%{http_code}" "https://asph.discloud.app/assets/home-hero-4k.jpg?v=20260920-hero-jpg" || true)
              echo "Homepage hero JPG HTTP status: $HERO_JPG_HTTP"
              if [ "$HERO_JPG_HTTP" != "200" ] || ! file hero-home.jpg | grep -qi "JPEG image data"; then ok=false; fi

              for asset in rsl-shield.png rsl-top-logo.png rsl-footer-mark.png; do
                ASSET_HTTP=$(curl -sS -o "asset-$asset" -w "%{http_code}" "https://asph.discloud.app/assets/$asset" || true)
                echo "PNG artwork $asset HTTP status: $ASSET_HTTP"
                if [ "$ASSET_HTTP" != "200" ] || ! file "asset-$asset" | grep -qi 'PNG image'; then ok=false; fi
              done

              STALE_HOME_HTTP=$(curl -sS -o web-home-stale.html -w "%{http_code}"                 -H "Cookie: alu_web_session=invalid-production-smoke-session"                 "https://asph.discloud.app/" || true)
              echo "Web homepage with stale session HTTP status: $STALE_HOME_HTTP"
              if [ "$STALE_HOME_HTTP" != "200" ]; then ok=false; fi

              DISCORD_HTTP=$(curl -sS -o discord-user.json -w "%{http_code}"                 -H "Authorization: Bot $DISCORD_BOT_TOKEN"                 -H "Accept: application/json"                 "https://discord.com/api/v10/users/@me" || true)
              echo "Discord API HTTP status: $DISCORD_HTTP"
              if [ "$DISCORD_HTTP" != "200" ]; then ok=false; fi

              if [ "$ok" = true ]; then
                echo "Post-deployment smoke test passed."
                exit 0
              fi
              echo "Deep smoke checks failed."
              break
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Production is still starting; waiting 10 seconds before the next health check."
              sleep 10
            fi
          done

          echo "Post-deployment smoke test failed after 12 startup attempts."
          exit 1

      - name: Roll back to previous known-good revision
        id: rollback
        if: steps.restart.outcome == 'failure' || steps.smoke.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revision.outputs.previous_sha }}
          fetch-depth: 0

      - name: Clean failed-release workspace before rollback upload
        if: steps.restart.outcome == 'failure' || steps.smoke.outcome == 'failure'
        run: |
          set -euo pipefail
          # The smoke test creates downloaded response/artwork files after the
          # production checkout. Remove every untracked artifact so the rollback
          # upload contains only the known-good Git revision.
          git clean -fdx
          echo "Rollback workspace restored to the exact committed revision."

