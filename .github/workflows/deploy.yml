name: CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discloud-production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit
          pip check
          pip-audit -r requirements.txt
      - name: Compile
        run: python -m compileall -q .
      - name: Test
        run: pytest -q

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deployment checks
        run: python -m pip install --quiet pymongo

      - name: Validate deployment secrets
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          test -n "$DISCLOUD_TOKEN" || { echo "Missing DISCLOUD_TOKEN"; exit 1; }
          test -n "$DISCORD_BOT_TOKEN" || { echo "Missing DISCORD_BOT_TOKEN"; exit 1; }
          test -n "$MONGO_URI" || { echo "Missing MONGO_URI"; exit 1; }
          echo "Required deployment secrets are present."

      - name: Validate Discord token
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o discord-preflight.json -w "%{http_code}"             -H "Authorization: Bot $DISCORD_BOT_TOKEN"             -H "Accept: application/json"             "https://discord.com/api/v10/users/@me" || true)"
          echo "Discord preflight HTTP status: $code"
          test "$code" = "200"

      - name: Validate production asset
        run: |
          set -euo pipefail
          asset="ALU_Gauntlet/web/static/assets/home-hero-4k.jpg"
          test -f "$asset"
          file "$asset"
          file "$asset" | grep -qi "JPEG image data"

      - name: Capture rollback revision
        id: revision
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          previous="$EVENT_BEFORE"
          if [ -z "$previous" ] || [ "$previous" = "0000000000000000000000000000000000000000" ]; then
            previous="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$previous^{commit}"
          git merge-base --is-ancestor "$previous" HEAD
          echo "previous_sha=$previous" >> "$GITHUB_OUTPUT"

      - name: Clean CI artifacts
        run: |
          rm -f discord-preflight.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache

      - name: Deploy to Discloud
        id: deploy
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: asph
          glob: "**"
          team: "false"

      - name: Restart Discloud app
        id: restart
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            code="$(curl -sS -o discloud-restart.json -w "%{http_code}" -X PUT               -H "api-token: $DISCLOUD_TOKEN"               -H "Accept: application/json"               "https://api.discloud.app/v2/app/asph/restart" || true)"
            echo "Restart attempt $attempt/3 HTTP status: $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep 20
          done
          exit 1

      - name: Smoke test
        id: smoke
        if: steps.restart.outcome == 'success'
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "Smoke test attempt $attempt/12"
            healthy=true

            code="$(curl -sS -o web-health.json -w "%{http_code}"               "https://asph.discloud.app/healthz" || true)"
            echo "Web health HTTP status: $code"
            if [ "$code" != "200" ]; then
              healthy=false
            elif ! python - <<'PY'
import json
from pathlib import Path
data = json.loads(Path("web-health.json").read_text())
raise SystemExit(0 if data.get("ok") else 1)
PY
            then
              healthy=false
            fi

            discord_code="$(curl -sS -o discord-user.json -w "%{http_code}"               -H "Authorization: Bot $DISCORD_BOT_TOKEN"               -H "Accept: application/json"               "https://discord.com/api/v10/users/@me" || true)"
            echo "Discord API HTTP status: $discord_code"
            [ "$discord_code" = "200" ] || healthy=false

            if [ "$healthy" = true ]; then
              echo "Production smoke test passed."
              exit 0
            fi
            [ "$attempt" -lt 12 ] && sleep 10
          done
          exit 1

      - name: Roll back workspace
        if: steps.restart.outcome == 'failure' || steps.smoke.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.revision.outputs.previous_sha }}
          fetch-depth: 0

      - name: Clean rollback workspace
        if: steps.restart.outcome == 'failure' || steps.smoke.outcome == 'failure'
        run: git clean -fdx

      - name: Deploy rollback to Discloud
        id: rollback_deploy
        if: steps.restart.outcome == 'failure' || steps.smoke.outcome == 'failure'
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: asph
          glob: "**"
          team: "false"

      - name: Restart rollback
        id: rollback_restart
        if: (steps.restart.outcome == 'failure' || steps.smoke.outcome == 'failure') && steps.rollback_deploy.outcome == 'success'
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            code="$(curl -sS -o rollback-restart.json -w "%{http_code}" -X PUT               -H "api-token: $DISCLOUD_TOKEN"               -H "Accept: application/json"               "https://api.discloud.app/v2/app/asph/restart" || true)"
            echo "Rollback restart attempt $attempt/3 HTTP status: $code"
            if [ "$code" = "200" ]; then exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 20
          done
          exit 1

      - name: Verify rollback
        if: (steps.restart.outcome == 'failure' || steps.smoke.outcome == 'failure') && steps.rollback_restart.outcome == 'success'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            web_code="$(curl -sS -o rollback-health.json -w "%{http_code}"               "https://asph.discloud.app/healthz" || true)"
            discord_code="$(curl -sS -o rollback-discord.json -w "%{http_code}"               -H "Authorization: Bot $DISCORD_BOT_TOKEN"               -H "Accept: application/json"               "https://discord.com/api/v10/users/@me" || true)"
            echo "Rollback web=$web_code discord=$discord_code"
            if [ "$web_code" = "200" ] && [ "$discord_code" = "200" ] &&                python - <<'PY'
import json
from pathlib import Path
raise SystemExit(0 if json.loads(Path("rollback-health.json").read_text()).get("ok") else 1)
PY
            then
              echo "Rollback verification passed."
              exit 0
            fi
            [ "$attempt" -lt 6 ] && sleep 10
          done
          echo "Rollback verification failed."
          exit 1

      - name: Fail recovery if rollback did not complete
        if: (steps.restart.outcome == 'failure' || steps.smoke.outcome == 'failure') && (steps.rollback_deploy.outcome != 'success' || steps.rollback_restart.outcome != 'success')
        run: |
          echo "Production deployment failed and rollback was not confirmed."
          exit 1

      - name: Report recovered deployment
        if: (steps.restart.outcome == 'failure' || steps.smoke.outcome == 'failure') && steps.rollback_restart.outcome == 'success'
        run: |
          echo "New release failed its production gate, but the previous revision was restored."
