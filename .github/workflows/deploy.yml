name: CI and Deploy

on:
  push:
    branches:
      - feature/web-control-center
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discloud-production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit
          pip check
          pip-audit -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Test
        run: pytest -q

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine rollback revision
        id: revision
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          previous="$EVENT_BEFORE"
          if [ -z "$previous" ] || [ "$previous" = "0000000000000000000000000000000000000000" ]; then
            previous="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$previous^{commit}"
          echo "previous_sha=$previous" >> "$GITHUB_OUTPUT"
          echo "Rollback revision: $previous"

      - name: Record deployment start time
        id: deployment
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Validate deployment secrets are present
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          for name in DISCLOUD_TOKEN DISCLOUD_APP_ID DISCORD_BOT_TOKEN MONGO_URI; do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name GitHub secret is missing from the deploy job."
              exit 1
            fi
          done
          echo "Deployment secrets are present."

      - name: Deploy to Discloud (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54 # v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: ${{ secrets.DISCLOUD_APP_ID }}
          glob: '**'
          team: false

      - name: Wait before Discloud retry 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to Discloud (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54 # v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: ${{ secrets.DISCLOUD_APP_ID }}
          glob: '**'
          team: false

      - name: Wait before Discloud retry 3
        if: steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to Discloud (attempt 3)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54 # v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: ${{ secrets.DISCLOUD_APP_ID }}
          glob: '**'
          team: false

      - name: Determine deployment result
        id: deploy_status
        if: always()
        env:
          DEPLOY1_OUTCOME: ${{ steps.deploy1.outcome }}
          DEPLOY2_OUTCOME: ${{ steps.deploy2.outcome }}
          DEPLOY3_OUTCOME: ${{ steps.deploy3.outcome }}
        run: |
          set -euo pipefail
          echo "attempt 1: $DEPLOY1_OUTCOME"
          echo "attempt 2: $DEPLOY2_OUTCOME"
          echo "attempt 3: $DEPLOY3_OUTCOME"
          if [ "$DEPLOY1_OUTCOME" = "success" ] || [ "$DEPLOY2_OUTCOME" = "success" ] || [ "$DEPLOY3_OUTCOME" = "success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "At least one Discloud deployment attempt succeeded."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "All Discloud deployment attempts failed."
          fi

      - name: Fail if all Discloud deploy attempts failed
        if: steps.deploy_status.outputs.ok != 'true'
        run: exit 1

      - name: Post-deployment smoke test
        id: smoke
        continue-on-error: true
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DEPLOY_STARTED_AT: ${{ steps.deployment.outputs.started_at }}
        run: |
          set -euo pipefail
          python -m pip install --quiet pymongo

          for attempt in $(seq 1 10); do
            echo "Smoke test attempt $attempt/10"
            ok=true

            discloud_http=$(curl -sS -o discloud-status.json -w "%{http_code}" \
              -H "api-token: $DISCLOUD_TOKEN" \
              -H "Accept: application/json" \
              "https://api.discloud.app/v2/app/${DISCLOUD_APP_ID}/status" || true)
            echo "Discloud HTTP status: $discloud_http"
            if [ "$discloud_http" != "200" ]; then
              ok=false
            else
              if ! python - <<'PY'
          import json
          import sys

          with open("discloud-status.json", encoding="utf-8") as f:
              data = json.load(f)

          values = []

          def walk(value):
              if isinstance(value, str):
                  values.append(value.strip().lower())
              elif isinstance(value, list):
                  for item in value:
                      walk(item)
              elif isinstance(value, dict):
                  for item in value.values():
                      walk(item)

          walk(data)
          print("Discloud status values:", sorted(set(values)))
          if not {"running", "online", "active", "ready"}.intersection(values):
              sys.exit("Discloud reported no healthy state")
          PY
              then
                ok=false
              fi
            fi

            discord_http=$(curl -sS -o discord-user.json -w "%{http_code}" \
              -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
              -H "Accept: application/json" \
              "https://discord.com/api/v10/users/@me" || true)
            echo "Discord API HTTP status: $discord_http"
            if [ "$discord_http" != "200" ]; then
              ok=false
            fi

            if ! MONGO_URI="$MONGO_URI" DEPLOY_STARTED_AT="$DEPLOY_STARTED_AT" python - <<'PY'
          import os
          import sys
          from pymongo import MongoClient

          client = MongoClient(os.environ["MONGO_URI"], serverSelectionTimeoutMS=10000)
          try:
              client.admin.command("ping")
              heartbeat = client["asphalt_gauntlet"].system_events.find_one(
                  {"_id": "production_heartbeat"}
              )
          finally:
              client.close()

          if not heartbeat:
              sys.exit("No production heartbeat found")
          if float(heartbeat.get("timestamp", 0)) < float(os.environ["DEPLOY_STARTED_AT"]):
              sys.exit("Production heartbeat has not advanced")
          if not heartbeat.get("ready") or not heartbeat.get("db_ok"):
              sys.exit("Production heartbeat reports bot/database unhealthy")
          PY
            then
              ok=false
            fi

            if [ "$ok" = true ]; then
              echo "Post-deployment smoke test passed."
              exit 0
            fi

            if [ "$attempt" -lt 10 ]; then
              sleep 15
            fi
          done

          echo "Post-deployment smoke test failed after 10 attempts."
          exit 1

      - name: Roll back to previous known-good revision
        if: steps.smoke.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revision.outputs.previous_sha }}
          fetch-depth: 0

      - name: Deploy rollback to Discloud
        id: rollback_deploy
        if: steps.smoke.outcome == 'failure'
        continue-on-error: true
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54 # v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: ${{ secrets.DISCLOUD_APP_ID }}
          glob: '**'
          team: false

      - name: Retry rollback deployment
        if: steps.smoke.outcome == 'failure' && steps.rollback_deploy.outcome == 'failure'
        run: sleep 45

      - name: Deploy rollback retry
        id: rollback_retry
        if: steps.smoke.outcome == 'failure' && steps.rollback_deploy.outcome == 'failure'
        continue-on-error: true
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54 # v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: ${{ secrets.DISCLOUD_APP_ID }}
          glob: '**'
          team: false

      - name: Verify rollback health
        if: steps.smoke.outcome == 'failure'
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: ${{ secrets.DISCLOUD_APP_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          python -m pip install --quiet pymongo
          for attempt in $(seq 1 10); do
            discloud_http=$(curl -sS -o discloud-rollback.json -w "%{http_code}" \
              -H "api-token: $DISCLOUD_TOKEN" \
              -H "Accept: application/json" \
              "https://api.discloud.app/v2/app/${DISCLOUD_APP_ID}/status" || true)
            if [ "$discloud_http" = "200" ] && curl -sS -f -o discord-rollback.json \
              -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
              -H "Accept: application/json" \
              "https://discord.com/api/v10/users/@me"; then
              if MONGO_URI="$MONGO_URI" python - <<'PY'
          import os
          import sys
          import time
          from pymongo import MongoClient

          client = MongoClient(os.environ["MONGO_URI"], serverSelectionTimeoutMS=10000)
          try:
              client.admin.command("ping")
              heartbeat = client["asphalt_gauntlet"].system_events.find_one(
                  {"_id": "production_heartbeat"}
              )
          finally:
              client.close()

          if (
              not heartbeat
              or not heartbeat.get("ready")
              or not heartbeat.get("db_ok")
              or time.time() - float(heartbeat.get("timestamp", 0)) > 1200
          ):
              sys.exit(1)
          PY
              then
                echo "Rollback health verification passed."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 10 ]; then
              sleep 15
            fi
          done
          echo "Rollback health verification failed."
          exit 1

      - name: Mark deployment failed after successful recovery
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Deployment smoke test failed. The previous known-good revision was restored and verified."
          exit 1
