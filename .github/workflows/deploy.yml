name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Production deployment is owned by Discloud GitHub Integration.
# GitHub Actions is verification-only so the same commit is never uploaded
# by two independent deployment systems.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit
          pip check
          pip-audit -r requirements.txt

      - name: Validate homepage hero JPG
        run: |
          set -euo pipefail
          HERO_JPG="ALU_Gauntlet/web/static/assets/home-hero-4k.jpg"
          if [ ! -f "$HERO_JPG" ]; then
            echo "ERROR: $HERO_JPG is missing from the repository."
            exit 1
          fi
          file "$HERO_JPG"
          if ! file "$HERO_JPG" | grep -qi "JPEG image data"; then
            echo "ERROR: Homepage hero asset is not a valid JPEG."
            exit 1
          fi
          echo "Homepage hero JPG is valid."

      - name: Compile
        run: python -m compileall -q .

      - name: Test
        run: pytest -q
