name: CI and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialize production deployments so Discloud never receives overlapping deploy requests.
# Production deployment health is verified by the smoke-test and rollback gates below.
concurrency:
  group: discloud-production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit
          pip check
          pip-audit -r requirements.txt

      - name: Compile
        run: python -m compileall -q .

      - name: Test
        run: pytest -q

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python for deployment checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deployment check dependencies
        run: python -m pip install --quiet pymongo

      - name: Validate homepage hero JPG
        run: |
          set -euo pipefail
          HERO_JPG="ALU_Gauntlet/web/static/assets/home-hero-4k.jpg"
          if [ ! -f "$HERO_JPG" ]; then
            echo "ERROR: $HERO_JPG is missing from the repository."
            exit 1
          fi
          file "$HERO_JPG"
          if ! file "$HERO_JPG" | grep -qi "JPEG image data"; then
            echo "ERROR: Homepage hero asset is not a valid JPEG."
            exit 1
          fi
          echo "Homepage hero JPG is valid and will be deployed as committed."

      - name: Determine rollback revision
        id: revision
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          previous="$EVENT_BEFORE"
          if [ -z "$previous" ] || [ "$previous" = "0000000000000000000000000000000000000000" ]; then
            previous="$(git rev-parse HEAD^)"
          fi
          git cat-file -e "$previous^{commit}"
          echo "previous_sha=$previous" >> "$GITHUB_OUTPUT"
          echo "Rollback revision: $previous"

      - name: Record deployment start time
        id: deployment
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Validate deployment secrets are present
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          for name in DISCLOUD_TOKEN DISCORD_BOT_TOKEN MONGO_URI; do
            if [ -z "${!name}" ]; then
              echo "ERROR: $name GitHub secret is missing from the deploy job."
              exit 1
            fi
          done
          echo "Deployment secrets are present. Production Discloud app is fixed to asph. Secret values are never printed."

      - name: Validate Discord bot token before deployment
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o discord-preflight.json -w "%{http_code}" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Accept: application/json" \
            "https://discord.com/api/v10/users/@me" || true)
          echo "Discord API preflight HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: DISCORD_BOT_TOKEN is present but Discord rejected it. Deployment stopped before touching Discloud."
            exit 1
          fi
          echo "Discord bot token preflight passed."

      - name: Clean CI-generated files before Discloud upload
        run: |
          set -euo pipefail
          # Discloud uploads the production workspace. Remove files created by
          # CI checks so caches and preflight artifacts never enter production.
          rm -f discord-preflight.json discloud-status.json web-health.json web-login.html web-home.html web-home-stale.html
          rm -f hero-home.jpg web-css.css discord-user.json discloud-restart.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf .pytest_cache
          echo "CI-generated caches and preflight artifacts removed."

      - name: Capture pre-deployment heartbeat
        id: predeploy
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          heartbeat_at=$(MONGO_URI="$MONGO_URI" python -c 'import os; from pymongo import MongoClient; c=MongoClient(os.environ["MONGO_URI"], serverSelectionTimeoutMS=10000); h=c["asphalt_gauntlet"].system_events.find_one({"_id":"production_heartbeat"}); c.close(); print(float(h.get("timestamp",0)) if h else 0)')
          echo "heartbeat_at=$heartbeat_at" >> "$GITHUB_OUTPUT"
      # Retry transient Discloud deployment failures, including temporary 429s.
      - name: Deploy to Discloud (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54 # v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: asph
          glob: '**'
          team: false

      - name: Wait before Discloud retry 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - name: Deploy to Discloud (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54 # v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: asph
          glob: '**'
          team: false

      - name: Wait before Discloud retry 3
        if: steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to Discloud (attempt 3)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        continue-on-error: true
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54 # v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: asph
          glob: '**'
          team: false

      - name: Fail if all Discloud deploy attempts failed
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure' && steps.deploy3.outcome == 'failure'
        run: |
          echo "All Discloud deployment attempts failed."
          exit 1

      - name: Restart Discloud app after upload
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: asph
        run: |
          set -euo pipefail
          restart_http=$(curl -sS -o discloud-restart.json -w "%{http_code}" -X PUT \
            -H "api-token: $DISCLOUD_TOKEN" \
            -H "Accept: application/json" \
            "https://api.discloud.app/v2/app/${DISCLOUD_APP_ID}/restart" || true)
          echo "Discloud restart HTTP status: $restart_http"
          if [ "$restart_http" != "200" ]; then
            cat discloud-restart.json || true
            exit 1
          fi
          echo "Discloud restart requested successfully."
      # Use the exact curl/header pattern from production-health.yml. The prior
      # implementation used Python urllib for Discloud and received HTTP 403
      # while the production monitor using curl remained healthy.
      - name: Post-deployment smoke test
        id: smoke
        continue-on-error: true
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: asph
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DEPLOY_STARTED_AT: ${{ steps.deployment.outputs.started_at }}
          PREVIOUS_HEARTBEAT_AT: ${{ steps.predeploy.outputs.heartbeat_at }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "Smoke test attempt $attempt/12"
            ok=true

            DISCLOUD_HTTP=$(curl -sS -o discloud-status.json -w "%{http_code}" \
              -H "api-token: $DISCLOUD_TOKEN" \
              -H "Accept: application/json" \
              "https://api.discloud.app/v2/app/${DISCLOUD_APP_ID}/status" || true)
            echo "Discloud HTTP status: $DISCLOUD_HTTP"

            if [ "$DISCLOUD_HTTP" != "200" ]; then
              echo "Discloud status check failed."
              ok=false
            else
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("discloud-status.json").read_text())
          values = []
          def collect(value):
              if isinstance(value, dict):
                  for item in value.values(): collect(item)
              elif isinstance(value, list):
                  for item in value: collect(item)
              elif isinstance(value, str):
                  values.append(value.strip().lower())
          collect(data)
          healthy = {"running", "online", "active", "ready"}.intersection(values)
          if healthy:
              print("Discloud status reports healthy:", ", ".join(sorted(healthy)))
          else:
              print("WARNING: Discloud status API did not report a healthy state:", values)
              print("Continuing; web health and production heartbeat are authoritative runtime checks.")
          PY
            fi

            HEARTBEAT_OK=$(MONGO_URI="$MONGO_URI" PREVIOUS_HEARTBEAT_AT="$PREVIOUS_HEARTBEAT_AT" python - <<'PY'
import os
import time
from pymongo import MongoClient

client = MongoClient(os.environ["MONGO_URI"], serverSelectionTimeoutMS=10000)
client.admin.command("ping")
hb = client["asphalt_gauntlet"].system_events.find_one({"_id": "production_heartbeat"})
client.close()

if not hb or not hb.get("ready") or not hb.get("db_ok"):
    print("false")
    raise SystemExit

timestamp = float(hb.get("timestamp", 0))
previous = float(os.environ.get("PREVIOUS_HEARTBEAT_AT", "0") or 0)
age = time.time() - timestamp
if age > 120 or (previous and timestamp <= previous):
    print("false")
    raise SystemExit

print("true")
PY
            )
            echo "Production heartbeat gate: $HEARTBEAT_OK"
            if [ "$HEARTBEAT_OK" != "true" ]; then
              echo "Production heartbeat is missing, unhealthy, stale, or has not advanced past the pre-deploy heartbeat."
              ok=false
            fi

            WEB_HTTP=$(curl -sS -o web-health.json -w "%{http_code}" "https://asph.discloud.app/healthz" || true)
            echo "Web health HTTP status: $WEB_HTTP"
            if [ "$WEB_HTTP" != "200" ]; then
              echo "Web control-center health endpoint failed."
              ok=false
            else
              python - <<'PY' || ok=false
          import json
          from pathlib import Path
          data=json.loads(Path("web-health.json").read_text())
          if not data.get("ok"):
              raise SystemExit(f"Web health reports unhealthy: {data}")
          print("Web control-center health check passed.")
          PY
            fi

            # Once the four core runtime signals are healthy, perform the deeper
            # static/Discord/session checks once. This avoids downloading the same
            # artwork/CSS repeatedly while Discloud is still starting.
            if [ "$ok" = true ]; then
              echo "Core production health is ready; running deep smoke checks once."

              for check in                 "https://asph.discloud.app/login"                 "https://asph.discloud.app/"                 "https://asph.discloud.app/static/app.css"; do
                case "$check" in
                  *"/login") output="web-login.html"; label="Web login" ;;
                  *"/static/app.css") output="web-css.css"; label="Web static CSS" ;;
                  *) output="web-home.html"; label="Web homepage" ;;
                esac
                HTTP=$(curl -sS -o "$output" -w "%{http_code}" "$check" || true)
                echo "$label HTTP status: $HTTP"
                if [ "$HTTP" != "200" ]; then ok=false; fi
              done

              HERO_JPG_HTTP=$(curl -sS -o hero-home.jpg -w "%{http_code}" "https://asph.discloud.app/assets/home-hero-4k.jpg?v=20260920-hero-jpg" || true)
              echo "Homepage hero JPG HTTP status: $HERO_JPG_HTTP"
              if [ "$HERO_JPG_HTTP" != "200" ] || ! file hero-home.jpg | grep -qi "JPEG image data"; then ok=false; fi

              for asset in rsl-shield.png rsl-top-logo.png rsl-footer-mark.png; do
                ASSET_HTTP=$(curl -sS -o "asset-$asset" -w "%{http_code}" "https://asph.discloud.app/assets/$asset" || true)
                echo "PNG artwork $asset HTTP status: $ASSET_HTTP"
                if [ "$ASSET_HTTP" != "200" ] || ! file "asset-$asset" | grep -qi 'PNG image'; then ok=false; fi
              done

              STALE_HOME_HTTP=$(curl -sS -o web-home-stale.html -w "%{http_code}"                 -H "Cookie: alu_web_session=invalid-production-smoke-session"                 "https://asph.discloud.app/" || true)
              echo "Web homepage with stale session HTTP status: $STALE_HOME_HTTP"
              if [ "$STALE_HOME_HTTP" != "200" ]; then ok=false; fi

              DISCORD_HTTP=$(curl -sS -o discord-user.json -w "%{http_code}"                 -H "Authorization: Bot $DISCORD_BOT_TOKEN"                 -H "Accept: application/json"                 "https://discord.com/api/v10/users/@me" || true)
              echo "Discord API HTTP status: $DISCORD_HTTP"
              if [ "$DISCORD_HTTP" != "200" ]; then ok=false; fi

              if [ "$ok" = true ]; then
                echo "Post-deployment smoke test passed."
                exit 0
              fi
              echo "Deep smoke checks failed."
              break
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Production is still starting; waiting 10 seconds before the next health check."
              sleep 10
            fi
          done

          echo "Post-deployment smoke test failed after 12 startup attempts."
          exit 1

      - name: Roll back to previous known-good revision
        id: rollback
        if: steps.smoke.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revision.outputs.previous_sha }}
          fetch-depth: 0

      - name: Clean failed-release workspace before rollback upload
        if: steps.smoke.outcome == 'failure'
        run: |
          set -euo pipefail
          # The smoke test creates downloaded response/artwork files after the
          # production checkout. Remove every untracked artifact so the rollback
          # upload contains only the known-good Git revision.
          git clean -fdx
          echo "Rollback workspace restored to the exact committed revision."

      - name: Deploy rollback to Discloud
        id: rollback_deploy
        if: steps.smoke.outcome == 'failure'
        continue-on-error: true
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54 # v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: asph
          glob: '**'
          team: false

      - name: Retry rollback deployment
        if: steps.smoke.outcome == 'failure' && steps.rollback_deploy.outcome == 'failure'
        run: sleep 45

      - name: Deploy rollback retry
        id: rollback_retry
        if: steps.smoke.outcome == 'failure' && steps.rollback_deploy.outcome == 'failure'
        continue-on-error: true
        uses: discloud/deploy-action@fae7024653d941a19daa2b6f56d2ae208e008c54 # v1
        with:
          token: ${{ secrets.DISCLOUD_TOKEN }}
          app_id: asph
          glob: '**'
          team: false

      - name: Fail recovery if rollback upload failed
        if: steps.smoke.outcome == 'failure' && steps.rollback_deploy.outcome == 'failure' && steps.rollback_retry.outcome == 'failure'
        run: |
          echo "ERROR: Both rollback uploads failed. Refusing to restart or mark production recovered."
          exit 1

      - name: Restart Discloud app after rollback upload
        if: steps.smoke.outcome == 'failure'
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: asph
        run: |
          set -euo pipefail
          restart_http=$(curl -sS -o discloud-rollback-restart.json -w "%{http_code}" -X PUT \
            -H "api-token: $DISCLOUD_TOKEN" \
            -H "Accept: application/json" \
            "https://api.discloud.app/v2/app/${DISCLOUD_APP_ID}/restart" || true)
          echo "Rollback Discloud restart HTTP status: $restart_http"
          if [ "$restart_http" != "200" ]; then
            cat discloud-rollback-restart.json || true
            exit 1
          fi
          echo "Rollback Discloud restart requested successfully."
      - name: Verify rollback health
        if: steps.smoke.outcome == 'failure'
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: asph
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            echo "Rollback verification attempt $attempt/6"
            discloud_http=$(curl -sS -o discloud-rollback.json -w "%{http_code}" \
              -H "api-token: $DISCLOUD_TOKEN" \
              -H "Accept: application/json" \
              "https://api.discloud.app/v2/app/${DISCLOUD_APP_ID}/status" || true)
            echo "Rollback Discloud HTTP status: $discloud_http"

            if [ "$discloud_http" = "200" ] && \
               curl -sS -f -o discord-rollback.json \
                 -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
                 -H "Accept: application/json" \
                 "https://discord.com/api/v10/users/@me"; then
              if MONGO_URI="$MONGO_URI" python - <<'PY'
          import os
          import time
          from pymongo import MongoClient
          client = MongoClient(os.environ["MONGO_URI"], serverSelectionTimeoutMS=10000)
          client.admin.command("ping")
          hb = client["asphalt_gauntlet"].system_events.find_one({"_id": "production_heartbeat"})
          client.close()
          if not hb or not hb.get("ready") or not hb.get("db_ok"):
              raise SystemExit(1)
          if time.time() - float(hb.get("timestamp", 0)) > 1200:
              raise SystemExit(1)
          print("Rollback heartbeat verification passed.")
          PY
              then
                python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("discloud-rollback.json").read_text())
          values = []
          def collect(value):
              if isinstance(value, dict):
                  for item in value.values(): collect(item)
              elif isinstance(value, list):
                  for item in value: collect(item)
              elif isinstance(value, str):
                  values.append(value.strip().lower())
          collect(data)
          healthy = {"running", "online", "active", "ready"}.intersection(values)
          if healthy:
              print("Rollback Discloud status reports healthy:", ", ".join(sorted(healthy)))
          else:
              print("WARNING: Rollback Discloud status did not report a healthy state:", values)
              print("Continuing; Discord and production heartbeat verification remain authoritative.")
          PY
                echo "Rollback health verification passed."
                exit 0
              fi
            fi

            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done

          echo "Rollback health verification failed."
          exit 1

      - name: Mark deployment failed after successful recovery
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Deployment smoke test failed, but the previous known-good revision was restored and verified successfully."
          echo "Production is healthy on the known-good revision. The workflow will remain successful because recovery completed."
