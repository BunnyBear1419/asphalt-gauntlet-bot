          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit ruff
          pip check
          pip-audit -r requirements.txt

      - name: Undefined-name lint
        run: ruff check ALU_Gauntlet tests --select F821 --output-format concise

      - name: Import lint on touched modules
        run: >-
          ruff check
          ALU_Gauntlet/cogs/player.py
          ALU_Gauntlet/core/core.py
          ALU_Gauntlet/core/rsl_economy.py
          ALU_Gauntlet/release.py
          ALU_Gauntlet/web/auth.py
          ALU_Gauntlet/web/routes/admin.py
          ALU_Gauntlet/web/routes/clubs.py
          ALU_Gauntlet/web/routes/core.py
          ALU_Gauntlet/web/routes/public.py
          ALU_Gauntlet/web/routes/auth.py
          --select F821,F401 --output-format concise

      - name: Compile
        run: python -m compileall -q .

      - name: Production module import smoke
        run: |
          python - <<'PY'
          import importlib
          from ALU_Gauntlet.main import EXTENSIONS
          from ALU_Gauntlet.web.control_center import WebControlCenter

          assert hasattr(WebControlCenter, "healthz"), "WebControlCenter is missing the /rsl-healthz handler"
          for extension in EXTENSIONS:
              importlib.import_module(extension)
          print(f"Imported {len(EXTENSIONS)} production Discord extensions successfully.")
          print("WebControlCenter exposes healthz successfully.")

      - name: Test
        run: pytest -q

