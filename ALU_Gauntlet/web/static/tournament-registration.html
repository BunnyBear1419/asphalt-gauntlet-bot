<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSL • Tournament Registration</title><link rel="stylesheet" href="/static/app.css?v=20260920-tourney"></head><body class="alu-dashboard"><header class="top-nav"><a class="top-brand" href="/">RACING SYNDICATE LEAGUE</a><nav><a href="/">⌂ Home</a><details class="top-nav-dropdown"><summary class="top-nav-dropdown-trigger active">🏆 Tournaments⌄</summary><div class="top-nav-dropdown-menu"><a href="/tournaments">Tournament Center</a><a href="/tournaments/registration">Registration</a><a href="/tournaments/matches">Brackets &amp; Matches</a><a href="/tournaments/results">Results &amp; Rankings</a><a href="/tournaments/clubs">Club Tournaments</a></div></details><a href="/clubs">♣ Clubs</a><a href="/help">? Help</a></nav><div class="top-user-area"><a class="auth-link" href="/logout">Sign Out</a></div></header><div class="app-frame"><div class="workspace"><main><section class="tournament-hero"><div><span class="eyebrow">TOURNAMENTS</span><h1>✍️ REGISTRATION</h1><p>Enter eligible events without changing your separate Gauntlet registration.</p></div></section><section class="glass-panel" style="padding:24px"><div class="panel-heading"><h2>Open Registration</h2></div><div id="list" class="tournament-list">Loading…</div></section></main></div></div><script>const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(u,o){const r=await fetch(u,{credentials:"same-origin",...o});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){const d=await api("/api/tournaments");const rows=(d.tournaments||[]).filter(t=>t.status==="registration_open"||t.status==="open");$("#list").innerHTML=rows.length?rows.map(t=>'<article class="glass-panel tournament-card"><div class="tournament-card-body"><div class="tournament-card-top"><span>'+esc(t.format_label||t.format)+'</span><b>'+Number(t.registration_count||0)+'/'+Number(t.max_players||0)+'</b></div><h2>'+esc(t.name)+'</h2><p>'+esc(t.description||"")+'</p><div class="tournament-meta"><span>📅 '+esc(t.start_time_label||"TBD")+'</span><span>🎯 '+esc(t.eligibility_label||"Open")+'</span></div><div class="tournament-card-actions"><button class="qa qa-purple" data-id="'+esc(t.id)+'">Register →</button></div></div></article>').join(""):'<div class="tournament-empty">No tournaments are currently accepting registrations.</div>';document.querySelectorAll("button[data-id]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{const t=rows.find(x=>String(x.id)===b.dataset.id);const payload={tournament_id:b.dataset.id};if(Number(t?.team_size||1)>1){const c=await api("/api/clubs");const clubs=(c.clubs||[]).filter(x=>x.leader);if(!clubs.length)throw Error("You need to lead a club before entering this team tournament.");payload.club_id=clubs[0].id}const r=await api("/api/tournaments/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});alert(r.message||"Registration submitted.");await load()}catch(e){alert(e.message);b.disabled=false}})}load().catch(e=>$("#list").textContent=e.message);</script></body></html>
