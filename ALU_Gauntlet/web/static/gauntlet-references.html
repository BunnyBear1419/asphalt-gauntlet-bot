<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gauntlet References • RSL</title><link rel="stylesheet" href="/static/app.css"><style>
.ref-wrap{max-width:1400px;margin:0 auto;padding:110px 24px 48px}.ref-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;margin-top:18px}.ref-card{border:1px solid #174a79;background:linear-gradient(145deg,#07172f,#020916);padding:20px;box-shadow:0 14px 40px #0008}.ref-card h3{margin:8px 0;color:#fff}.ref-meta{color:#7f9bbb;font-size:11px;line-height:1.5}.compare{margin-top:8px;padding:10px;background:#061427;border:1px solid #174a79}.ref-desc{color:#aebdd2;line-height:1.55;font-size:13px}.ref-video{width:100%;aspect-ratio:16/9;background:#02060d;border:1px solid #174a79;margin-top:12px}.ref-video iframe{width:100%;height:100%;border:0}.ref-toolbar{display:flex;gap:12px;flex-wrap:wrap}.ref-toolbar input,.ref-toolbar select,.ref-form input,.ref-form select,.ref-form textarea{background:#061427;border:1px solid #174a79;color:#fff;padding:11px}.ref-toolbar input{min-width:240px}.ref-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ref-form textarea{grid-column:1/-1;min-height:90px}.ref-form button{background:linear-gradient(90deg,#08bfff,#1878ff);color:#fff;border:0;padding:11px 18px;font-weight:800;cursor:pointer}.official{color:#18e19e;font-size:10px}@media(max-width:700px){.ref-wrap{padding:100px 14px 30px}.ref-form-grid{grid-template-columns:1fr}}
</style></head><body class="alu-dashboard"><header class="top-nav"><a class="top-brand top-logo-mark" href="/" aria-label="Racing Syndicate League"><img src="/assets/rsl-top-logo.png" alt=""></a><nav><a href="/">⌂ Home</a><details class="top-nav-dropdown"><summary class="top-nav-dropdown-trigger active">♜ Gauntlet ⌄</summary><div class="top-nav-dropdown-menu"><a href="/gauntlet/registration">✍️ Registration</a><a href="/gauntlet/defense">◆ Defense</a><a href="/gauntlet/matches">⚔ Challenges &amp; Matches</a><a href="/gauntlet/leaderboard">🏅 Leaderboards</a><a href="/gauntlet/references">🎥 References</a></div></details><a href="/tournaments">🏆 Tournaments</a><a href="/clubs">♣ Clubs</a><a href="/help">? Help</a></nav></header>
<main class="ref-wrap"><section class="page-hero"><span class="home-eyebrow">GAUNTLET</span><h1>References</h1><p>Course maps, reference runs, videos, car performance ratings, and your personal best comparison.</p></section><section class="glass-panel" style="padding:20px"><div class="ref-toolbar"><select id="course"><option value="">All Courses</option></select><input id="search" placeholder="Search course, driver, car or reference…"></div><div id="refs" class="ref-grid"><p>Loading references…</p></div><div id="staff" hidden><div class="panel-heading" style="margin-top:30px"><h2>Add Reference</h2></div><form id="form" class="ref-form"><div class="ref-form-grid"><select id="f-course" required></select><input id="f-title" required placeholder="Reference title"><input id="f-driver" placeholder="Reference driver"><input id="f-time" placeholder="Reference best time"><input id="f-car" placeholder="Reference car"><input id="f-rank" type="number" min="1" placeholder="Reference car performance rating"><input id="f-video" required placeholder="Video URL"><textarea id="f-description" placeholder="Notes / setup / route details"></textarea></div><label><input id="f-official" type="checkbox"> Official reference</label><br><br><button>Add Reference</button><p id="msg"></p></form></div></section></main>
<script>
const $=s=>document.querySelector(s);let refs=[];
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function embed(u){try{const x=new URL(u);if(x.hostname.includes("youtube.com")&&x.searchParams.get("v"))return "https://www.youtube.com/embed/"+x.searchParams.get("v");if(x.hostname==="youtu.be")return "https://www.youtube.com/embed/"+x.pathname.slice(1)}catch{}return "";}
function render(){const q=$("#search").value.toLowerCase(),c=$("#course").value;const rows=refs.filter(r=>(!c||r.course===c)&&(!q||[r.course,r.title,r.driver,r.car,r.description].join(" ").toLowerCase().includes(q)));$("#refs").innerHTML=rows.length?rows.map(r=>{const e=embed(r.video_url);const refRating=r.car_rank?" • Rating "+Number(r.car_rank).toLocaleString():"";const my=r.my_best_time||"—";const myCar=r.my_car?" • "+esc(r.my_car):"";const myRank=r.my_car_rank?" • Rating "+Number(r.my_car_rank).toLocaleString():"";return "<article class='ref-card'><div class='ref-meta'>"+esc(r.course)+(r.official?" <span class='official'>• OFFICIAL</span>":"")+"</div><h3>"+esc(r.title)+"</h3><div class='ref-meta'>Reference: "+esc(r.driver||"Reference Driver")+" • "+esc(r.time||"—")+" • "+esc(r.car||"—")+refRating+"</div><div class='ref-meta compare'><b>Your best:</b> "+esc(my)+myCar+myRank+"</div><p class='ref-desc'>"+esc(r.description||"")+"</p>"+(e?"<div class='ref-video'><iframe src='"+esc(e)+"' title='"+esc(r.title)+"' allowfullscreen></iframe></div>":"")+"<a href='"+esc(r.video_url)+"' target='_blank' rel='noopener'>Open Reference Video →</a></article>"}).join(""):"<p>No references match your filters.</p>";}
async function load(){const r=await fetch("/api/gauntlet/references",{credentials:"same-origin"});if(!r.ok)throw Error();const d=await r.json();refs=d.references||[];$("#staff").hidden=!d.is_staff;$("#course").innerHTML="<option value=''>All Courses</option>"+d.courses.map(c=>"<option>"+esc(c)+"</option>").join("");$("#f-course").innerHTML=d.courses.map(c=>"<option>"+esc(c)+"</option>").join("");render();}
$("#course").onchange=render;$("#search").oninput=render;
$("#form").onsubmit=async e=>{e.preventDefault();const p={course:$("#f-course").value,title:$("#f-title").value,driver:$("#f-driver").value,time:$("#f-time").value,car:$("#f-car").value,car_rank:$("#f-rank").value,video_url:$("#f-video").value,description:$("#f-description").value,official:$("#f-official").checked};const r=await fetch("/api/gauntlet/references",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});$("#msg").textContent=r.ok?"Reference added.":"Unable to add reference.";if(r.ok){e.target.reset();load();}};load().catch(()=>$("#refs").innerHTML="<p>Unable to load references.</p>");
</script></body></html>
