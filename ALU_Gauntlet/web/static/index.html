<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALU Gauntlet Control Center</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">ASPHALT LEGENDS UNITE</p>
        <h1>Gauntlet Control Center</h1>
        <p class="muted">One web interface for the same Gauntlet system your Discord bot uses.</p>
      </div>
      <div id="system-pill" class="pill">Checking bot…</div>
    </header>

    <section class="grid cards" aria-label="System status">
      <article class="card"><span>Bot</span><strong id="bot-status">—</strong></article>
      <article class="card"><span>Latency</span><strong id="latency">—</strong></article>
      <article class="card"><span>Discord Servers</span><strong id="guilds">—</strong></article>
      <article class="card"><span>Control Mode</span><strong>Read-only</strong></article>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div><p class="eyebrow">CONTROL CENTER</p><h2>Gauntlet modules</h2></div>
        <span class="muted">Phase 1 foundation</span>
      </div>
      <div class="grid modules">
        <button class="module"><span>👥</span><b>Players</b><small>Profiles and management</small></button>
        <button class="module"><span>🛡️</span><b>Defenses</b><small>Review and manage defenses</small></button>
        <button class="module"><span>⚔️</span><b>Matches</b><small>Challenges and submissions</small></button>
        <button class="module"><span>🏆</span><b>Seasons</b><small>Season controls and history</small></button>
        <button class="module"><span>📊</span><b>Analytics</b><small>Gauntlet statistics</small></button>
        <button class="module"><span>🧮</span><b>Simulator</b><small>Matchup and scenario tools</small></button>
        <button class="module"><span>⚙️</span><b>Server Setup</b><small>Channels, roles, timezone</small></button>
        <button class="module"><span>🔍</span><b>Launch Check</b><small>Readiness and health checks</small></button>
      </div>
    </section>

    <footer>ALU Gauntlet • Web Control Center</footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
