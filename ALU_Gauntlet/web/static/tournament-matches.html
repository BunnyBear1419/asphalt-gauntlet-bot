tion||"")+'</p>'+rounds.map(r=>'<section class="glass-panel" style="margin:14px 0;padding:18px"><h3>'+esc(r.name||("Round "+r.round))+'</h3>'+((r.matches||[]).map(m=>'<div class="review-row"><div><strong>'+esc(m.id||"Match")+'</strong><span>'+esc((m.player_slots||[]).filter(Boolean).join(" vs ")||"TBD vs TBD")+'</span></div><b>'+esc(m.status||"pending")+'</b></div>').join("")||'<p>No matches.</p>')+'</section>').join("")||'<p>Bracket not generated yet.</p>'}$("#pick").onchange=show;load().catch(e=>$("#detail").textContent=e.message);</script></body></html>
