<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSL • Tournament Brackets & Matches</title><link rel="stylesheet" href="/static/app.css?v=20260920-tourney"></head><body class="alu-dashboard"><header class="top-nav"><a class="top-brand" href="/">RACING SYNDICATE LEAGUE</a><nav><a href="/">⌂ Home</a><details class="top-nav-dropdown"><summary class="top-nav-dropdown-trigger active">🏆 Tournaments⌄</summary><div class="top-nav-dropdown-menu"><a href="/tournaments">Tournament Center</a><a href="/tournaments/registration">Registration</a><a href="/tournaments/matches">Brackets &amp; Matches</a><a href="/tournaments/results">Results &amp; Rankings</a><a href="/tournaments/clubs">Club Tournaments</a></div></details><a href="/clubs">♣ Clubs</a><a href="/help">? Help</a></nav><div class="top-user-area"><a class="auth-link" href="/logout">Sign Out</a></div></header><div class="app-frame"><div class="workspace"><main><section class="tournament-hero"><div><span class="eyebrow">TOURNAMENTS</span><h1>◆ BRACKETS &amp; MATCHES</h1><p>Follow tournament rounds, opponents and match status.</p></div></section><section class="glass-panel" style="padding:24px"><div class="panel-heading"><h2>Select Tournament</h2><select id="pick"></select></div><div id="detail" class="tournament-detail">Loading…</div></section></main></div></div><script>const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(u){const r=await fetch(u,{credentials:"same-origin"});if(!r.ok)throw Error(await r.text());return r.json()}function matches(b){return (b?.rounds||b?.winners||[]).flatMap(r=>r.matches||[])}async function load(){const d=await api("/api/tournaments");const ts=d.tournaments||[];$("#pick").innerHTML=ts.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+'</option>').join("");const hash=location.hash.slice(1);if(hash&&ts.some(t=>String(t.id)===hash))$("#pick").value=hash;await show()}async function show(){const t=await api("/api/tournaments/"+encodeURIComponent($("#pick").value));const ms=matches(t.bracket);const rounds=t.bracket?.rounds||t.bracket?.winners||[];$("#detail").innerHTML='<h2>'+esc(t.name)+'</h2><p>'+esc(t.description||"")+'</p>'+rounds.map(r=>'<section class="glass-panel" style="margin:14px 0;padding:18px"><h3>'+esc(r.name||("Round "+r.round))+'</h3>'+((r.matches||[]).map(m=>'<div class="review-row"><div><strong>'+esc(m.id||"Match")+'</strong><span>'+esc((m.player_slots||[]).filter(Boolean).join(" vs ")||"TBD vs TBD")+'</span></div><b>'+esc(m.status||"pending")+'</b></div>').join("")||'<p>No matches.</p>')+'</section>').join("")||'<p>Bracket not generated yet.</p>'}$("#pick").onchange=show;load().catch(e=>$("#detail").textContent=e.message);</script></body></html>
