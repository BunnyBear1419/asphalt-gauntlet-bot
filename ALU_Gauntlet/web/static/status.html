<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSL • System Status</title><link rel="stylesheet" href="/static/app.css?v=20261002-rsl-theme2"></head><body class="home-page"><main class="home-main"><section class="page-hero"><span class="home-eyebrow">RSL SYSTEM STATUS</span><h1>Racing Syndicate League</h1><p>Public service health for the website, Discord, database, competition services, authentication, and notifications.</p></section><section class="panel" style="margin-top:18px"><div id="status-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">Loading status…</div><p id="status-meta" style="margin-top:18px;color:#91a5c3"></p></section><p style="margin-top:18px;color:#7188a7">Competition disputes and support remain handled through the official RSL Discord ticket channel.</p></main><script>
(async()=>{const grid=document.getElementById("status-grid"),meta=document.getElementById("status-meta");try{const r=await fetch("/api/status/public",{cache:"no-store"}),d=await r.json();grid.innerHTML=Object.entries(d.services||{}).map(([k,v])=>'<div style="border:1px solid #174a79;padding:18px;background:var(--rsl-box)"><strong>'+k.replace(/_/g," ").toUpperCase()+'</strong><div style="margin-top:8px;font-weight:800">'+(v?"OPERATIONAL":"DEGRADED")+'</div></div>').join("");meta.textContent="Release "+(d.release||"unknown")+" • Overall "+(d.healthy?"Operational":"Degraded")+" • Updated "+new Date((d.generated_at||Date.now()/1000)*1000).toLocaleString()}catch(e){grid.textContent="Status information is temporarily unavailable.";meta.textContent="Please retry shortly."}})();
</script></body></html>
